services:
  xtream-downloader:
    build: .
    container_name: xtream-downloader
    # Use host network so the container can reach Emby on localhost (common WSL/Docker setup).
    # On plain Docker Desktop you may switch to bridge mode and publish port 8501 instead.
    network_mode: host
    volumes:
      - .:/app
      - ./.data:/app/.data
      - ${MOVIES_PATH:-./downloads/movies}:/download/movies
      - ${TV_PATH:-./downloads/tv}:/download/tv
      # Lettura nomi cartelle esistenti + scrittura libreria .strm (sync dalla Web UI)
      - ${STRM_MOVIES_PATH:-./strm/movies}:/strm/movies
      - ${STRM_SERIES_PATH:-./strm/series}:/strm/series
      # Cartella di test per generare/validare prima di promuovere in produzione
      - ${STRM_TEST_PATH:-./strm-test}:/strm-test
      # Credenziali OpenSubtitles del plugin Jellyfin (forced IT / fallback)
      - ${OPENSUBTITLES_JF_CONFIG:-/var/lib/jellyfin/config/data/plugins/configurations/Jellyfin.Plugin.OpenSubtitles.xml}:/config/Jellyfin.Plugin.OpenSubtitles.xml:ro
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UI_LANG=${UI_LANG:-en}
      - STRM_MOVIES_PATH=/strm/movies
      - STRM_SERIES_PATH=/strm/series
      - STRM_OUTPUT_MOVIES_PATH=/strm/movies
      - STRM_OUTPUT_SERIES_PATH=/strm/series
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-it-IT}
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - STREAM_PROXY_HOST=${STREAM_PROXY_HOST:-}
      - OPENSUBTITLES_JF_CONFIG=/config/Jellyfin.Plugin.OpenSubtitles.xml
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-gUCLWGoAg2PmyseoTM0INFFVPcDCeDlT}
    restart: unless-stopped
